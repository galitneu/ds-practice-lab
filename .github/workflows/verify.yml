name: Verify practice lab
on: [push, pull_request]
jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: ./setup.sh
      - run: USE_SOLUTIONS=1 make test
      - run: make notebooks
